version: '3.8'
networks:
  web_net:
    driver: bridge
    ipam:
      config:
      - subnet: 10.1.0.0/24
        gateway: 10.1.0.1
    driver_opts:
      com.docker.network.bridge.name: web_net
  employee_net_1:
    driver: bridge
    ipam:
